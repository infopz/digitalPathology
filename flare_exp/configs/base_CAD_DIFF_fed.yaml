  - trento_client
  - reggio_client
num_rounds: 10
train_script: flare_exp/client.py
cross_site_eval: false

# Metrics
key_metric: balanced_acc
eval_threshold_metric: balanced_acc
epoch_selection_metric: null

# Experiment tracking
enable_tracking: true
wandb_project: digital-pathology-fl

# Runtime/settings
num_workers: 4
seed: 7
