# Input/output paths
features_root: /home/ubuntu/giodir/digitalPathology/data/features/uni_features_merged_RE_TN
output_dir: /home/ubuntu/giodir/digitalPathology/outputs/cad_binary_diff/trained_models/fl/
manifest_set: fl_cad_binary_diff_5cv
job_name: fl_cad_binary_diff_base

# Model hyperparameters
model_type: gated_mil
attention_dim: 128
hidden_dim: 64
dropout: 0.5
input_dim: 1536
