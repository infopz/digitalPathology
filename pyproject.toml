[project]
name = "digital-pathology"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "huggingface>=0.0.1",
    "kaggle>=1.8.3",
    "kagglehub[pandas-datasets]>=0.4.1",
    "nvflare>=2.7.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pillow>=10.4.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.5.0",
    "timm>=1.0.24",
    "torch==2.9.1+cu126",
    "torchvision==0.24.1+cu126",
    "xgboost>=2.1.0",
    "ipykernel>=7.2.0",
    "openslide-python>=1.4.3",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "optuna>=4.9.0",
    "seaborn>=0.13.2",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
